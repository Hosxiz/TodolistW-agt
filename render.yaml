services:
  - type: web
    name: task-manager
    runtime: docker
    dockerfilePath: Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
    disks:
      - name: task-data
        mountPath: /data
        sizeGB: 1
