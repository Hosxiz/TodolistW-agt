<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แผงงาน</title>
  <style>
    :root {
      --bg: #f3ede4;
      --bg-2: #e7dfd2;
      --panel: rgba(255,255,255,0.72);
      --panel-strong: rgba(255,255,255,0.9);
      --ink: #1e1a17;
      --muted: #5f564d;
      --line: rgba(30, 26, 23, 0.1);
      --clay: #bf624d;
      --clay-deep: #9f4f3d;
      --sage: #8fa38a;
      --forest: #2d473a;
      --gold: #d4af67;
      --shadow: 0 22px 52px rgba(30,26,23,0.1);
      --radius-xl: 30px;
      --radius-lg: 20px;
      --radius-md: 16px;
      --focus: rgba(191, 98, 77, 0.2);
    }

    body.dark {
      --bg: #111827;
      --bg-2: #1f2937;
      --panel: rgba(17,24,39,0.82);
      --panel-strong: rgba(17,24,39,0.96);
      --ink: #f3f4f6;
      --muted: #a7b0bd;
      --line: rgba(148, 163, 184, 0.18);
      --clay: #ef8d6f;
      --clay-deep: #e77857;
      --sage: #7ea07a;
      --forest: #a7d2b0;
      --gold: #f0c97a;
      --shadow: 0 18px 42px rgba(2,6,23,0.42);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, rgba(212,175,103,0.18), transparent 25%), linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, sans-serif;
      line-height: 1.5;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }

    .app-shell {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 26px 28px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--clay) 0%, var(--gold) 100%);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.7rem, 2.5vw, 2.6rem);
      letter-spacing: -0.05em;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn,
    .chip,
    select,
    input,
    button {
      border-radius: 12px;
      font-family: "Segoe UI", Tahoma, sans-serif;
      transition: all 0.2s ease;
    }

    .btn,
    button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.08);
      color: var(--ink);
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover,
    button:hover {
      transform: translateY(-1px);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 88px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
    }

    .chip.active {
      background: var(--clay);
      border-color: var(--clay);
      color: white;
    }

    .toggle-theme {
      background: rgba(17,24,39,0.08);
    }

    body.dark .toggle-theme {
      background: rgba(255,255,255,0.07);
      color: var(--ink);
    }

    .content {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 0;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      padding: 22px 18px 20px;
      background: rgba(255,255,255,0.04);
    }

    .panel-title {
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 14px;
    }

    .meta-stack {
      display: grid;
      gap: 12px;
      margin-bottom: 22px;
    }

    .meta-card {
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 14px 14px 12px;
    }

    .meta-label {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 8px;
      font-family: "Segoe UI", sans-serif;
    }

    .meta-value {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.05em;
    }

    .main {
      padding: 22px 22px 28px;
    }

    .composer {
      display: grid;
      grid-template-columns: 1.3fr 1.6fr 0.75fr 0.75fr auto;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--panel-strong);
      margin-bottom: 22px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.03);
    }

    input, select {
      width: 100%;
      min-height: 50px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.06);
      color: var(--ink);
    }

    input:focus,
    select:focus,
    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
      border-color: var(--clay);
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--clay) 0%, var(--clay-deep) 100%);
      color: #fff;
      border-color: transparent;
      min-width: 120px;
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .search-input {
      flex: 1 1 220px;
      min-width: 180px;
      max-width: 360px;
    }

    .lists-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .lists-header h2 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: -0.03em;
    }

    .task-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    .task-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto auto;
      gap: 14px;
      align-items: center;
      padding: 16px 18px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
    }

    .task-item.completed {
      background: rgba(143, 163, 138, 0.08);
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-check {
      accent-color: var(--forest);
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .task-content {
      min-width: 0;
    }

    .task-title {
      font-weight: 700;
      font-size: 1.08rem;
      letter-spacing: -0.02em;
      word-break: break-word;
    }

    .task-description {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 4px;
      word-break: break-word;
      font-family: "Segoe UI", sans-serif;
    }

    .priority-badge,
    .status-badge,
    .date-badge {
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-family: "Segoe UI", sans-serif;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .priority-low { background: rgba(143,163,138,0.12); color: var(--forest); }
    .priority-medium { background: rgba(212,175,103,0.14); color: #8a5c1a; }
    .priority-high { background: rgba(191,98,77,0.12); color: var(--clay-deep); }

    .status-open { background: rgba(191,98,77,0.1); color: var(--clay-deep); }
    .status-done { background: rgba(45,71,58,0.12); color: var(--forest); }

    .date-badge {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .danger-btn {
      background: rgba(191,98,77,0.08);
      color: var(--clay-deep);
      border-color: rgba(191,98,77,0.18);
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: var(--radius-md);
      padding: 28px 18px;
      background: rgba(255,255,255,0.04);
      font-family: "Segoe UI", sans-serif;
    }

    @media (max-width: 980px) {
      .content { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--line); }
      .composer {
        grid-template-columns: 1fr 1fr;
      }
      .primary-btn {
        grid-column: span 2;
      }
    }

    @media (max-width: 640px) {
      .topbar { flex-direction: column; align-items: flex-start; }
      .composer { grid-template-columns: 1fr; }
      .primary-btn { grid-column: auto; }
      .task-item {
        grid-template-columns: auto 1fr;
        grid-template-areas:
          "check title"
          "check desc"
          "priority status"
          "date delete";
      }
      .task-check { grid-area: check; }
      .task-content { grid-area: title; }
      .task-description { grid-area: desc; }
      .priority-badge { grid-area: priority; justify-self: start; }
      .status-badge { grid-area: status; justify-self: start; }
      .date-badge { grid-area: date; justify-self: start; }
      .danger-btn { grid-area: delete; justify-self: end; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="app-shell">
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">N</div>
          <h1>แผงงาน</h1>
        </div>
        <div class="toolbar">
          <button class="toggle-theme" type="button" id="themeToggle">โหมดกลางคืน</button>
        </div>
      </div>

      <div class="content">
        <aside class="sidebar">
          <div class="panel-title">ภาพรวม</div>
          <div class="meta-stack">
            <div class="meta-card">
              <div class="meta-label">ทั้งหมด</div>
              <div class="meta-value" id="totalTasks">0</div>
            </div>
            <div class="meta-card">
              <div class="meta-label">ยังเปิด</div>
              <div class="meta-value" id="openTasks">0</div>
            </div>
            <div class="meta-card">
              <div class="meta-label">เสร็จแล้ว</div>
              <div class="meta-value" id="doneTasks">0</div>
            </div>
          </div>
        </aside>

        <main class="main">
          <form id="taskForm" class="composer" aria-label="เพิ่มงานใหม่">
            <input id="titleInput" type="text" placeholder="หัวข้องาน" aria-label="หัวข้องาน" required />
            <input id="descriptionInput" type="text" placeholder="รายละเอียด" aria-label="รายละเอียด" />
            <select id="priorityInput" aria-label="ความสำคัญ">
              <option value="low">ต่ำ</option>
              <option value="medium" selected>กลาง</option>
              <option value="high">สูง</option>
            </select>
            <input id="dueDateInput" type="date" aria-label="วันที่กำหนด" />
            <button class="primary-btn" type="submit">เพิ่มงาน</button>
          </form>

          <div class="filters" aria-label="ตัวกรองงาน">
            <input id="searchInput" class="search-input" type="search" placeholder="ค้นหางาน..." aria-label="ค้นหางาน" />
            <button class="chip active" data-status="all" type="button">ทั้งหมด</button>
            <button class="chip" data-status="open" type="button">ยังเปิด</button>
            <button class="chip" data-status="done" type="button">เสร็จแล้ว</button>
            <button class="chip" data-priority="all" type="button">ทุกระดับ</button>
            <button class="chip" data-priority="low" type="button">ต่ำ</button>
            <button class="chip" data-priority="medium" type="button">กลาง</button>
            <button class="chip" data-priority="high" type="button">สูง</button>
          </div>

          <div class="lists-header">
            <h2>รายการงาน</h2>
          </div>
          <ul id="taskList" class="task-list" aria-live="polite"></ul>
        </main>
      </div>
    </div>
  </div>

  <script>
    const taskList = document.getElementById('taskList');
    const taskForm = document.getElementById('taskForm');
    const totalTasks = document.getElementById('totalTasks');
    const openTasks = document.getElementById('openTasks');
    const doneTasks = document.getElementById('doneTasks');
    const themeToggle = document.getElementById('themeToggle');
    const searchInput = document.getElementById('searchInput');

    const state = {
      status: 'all',
      priority: 'all',
      search: '',
    };

    function getPriorityLabel(priority) {
      const labels = { low: 'ต่ำ', medium: 'กลาง', high: 'สูง' };
      return labels[priority] || 'กลาง';
    }

    function getStatusLabel(done) {
      return done ? 'เสร็จแล้ว' : 'ยังเปิด';
    }

    function formatDueDate(dateString) {
      if (!dateString) return 'ไม่มีวันกำหนด';
      const date = new Date(dateString + 'T00:00:00');
      return isNaN(date) ? 'ไม่มีวันกำหนด' : date.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderTask(task) {
      const item = document.createElement('li');
      item.className = `task-item ${task.completed ? 'completed' : ''}`;
      item.innerHTML = `
        <input class="task-check" type="checkbox" ${task.completed ? 'checked' : ''} aria-label="เปลี่ยนสถานะงาน ${task.title}" />
        <div class="task-content">
          <div class="task-title">${task.title}</div>
          <div class="task-description">${task.description || 'ไม่มีรายละเอียด'}</div>
        </div>
        <span class="priority-badge priority-${task.priority || 'medium'}">${getPriorityLabel(task.priority || 'medium')}</span>
        <span class="status-badge ${task.completed ? 'status-done' : 'status-open'}">${getStatusLabel(task.completed)}</span>
        <span class="date-badge">${formatDueDate(task.due_date)}</span>
        <button class="danger-btn" type="button" aria-label="ลบงาน ${task.title}">ลบ</button>
      `;

      const checkbox = item.querySelector('.task-check');
      checkbox.addEventListener('change', async () => {
        await fetch(`/tasks/${task.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed: checkbox.checked })
        });
        loadTasks();
      });

      item.querySelector('.danger-btn').addEventListener('click', async () => {
        await fetch(`/tasks/${task.id}`, { method: 'DELETE' });
        loadTasks();
      });

      return item;
    }

    async function loadTasks() {
      const params = new URLSearchParams();
      if (state.status !== 'all') params.set('status', state.status);
      if (state.priority !== 'all') params.set('priority', state.priority);
      if (state.search) params.set('q', state.search);

      const response = await fetch(`/tasks?${params.toString()}`);
      const tasks = await response.json();
      taskList.innerHTML = '';

      if (!tasks.length) {
        taskList.innerHTML = '<li class="empty-state">ไม่มีงานที่ตรงกับตัวกรองนี้</li>';
      } else {
        tasks.forEach(task => taskList.appendChild(renderTask(task)));
      }

      const open = tasks.filter(task => !task.completed).length;
      const done = tasks.filter(task => task.completed).length;
      totalTasks.textContent = String(tasks.length);
      openTasks.textContent = String(open);
      doneTasks.textContent = String(done);
    }

    taskForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const title = document.getElementById('titleInput').value.trim();
      const description = document.getElementById('descriptionInput').value.trim();
      const priority = document.getElementById('priorityInput').value;
      const dueDate = document.getElementById('dueDateInput').value;

      if (!title) return;

      await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description, completed: false, priority, due_date: dueDate || null })
      });

      taskForm.reset();
      document.getElementById('priorityInput').value = 'medium';
      loadTasks();
    });

    document.querySelectorAll('.chip[data-status]').forEach(button => {
      button.addEventListener('click', () => {
        state.status = button.dataset.status;
        document.querySelectorAll('.chip[data-status]').forEach(item => item.classList.toggle('active', item === button));
        loadTasks();
      });
    });

    document.querySelectorAll('.chip[data-priority]').forEach(button => {
      button.addEventListener('click', () => {
        state.priority = button.dataset.priority;
        document.querySelectorAll('.chip[data-priority]').forEach(item => item.classList.toggle('active', item === button));
        loadTasks();
      });
    });

    let searchTimeout;
    searchInput.addEventListener('input', () => {
      state.search = searchInput.value.trim();
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(loadTasks, 250);
    });

    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (prefersDark) {
      document.body.classList.add('dark');
      themeToggle.textContent = 'โหมดสว่าง';
    }

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      themeToggle.textContent = document.body.classList.contains('dark') ? 'โหมดสว่าง' : 'โหมดกลางคืน';
    });

    loadTasks();
  </script>
</body>
</html>
